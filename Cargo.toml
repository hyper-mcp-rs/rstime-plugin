[package]
name = "rstime"
version = "0.1.5"
edition = "2021"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
base64 = "0.21"
base64-serde = "0.7"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
extism-pdk = "1.4.1"
git-version = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]

[package.metadata.release]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
